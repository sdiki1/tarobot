{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-logo">🔮</span>
      <span><b>Taro Bot</b><small>Админ-панель</small></span>
    </div>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field"><label for="login">Логин</label><input type="text" id="login" name="login" required autofocus autocomplete="username"></div>
      <div class="field"><label for="password">Пароль</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
      <button type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
