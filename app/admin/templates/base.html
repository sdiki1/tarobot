<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Админ-панель{% endblock %} · Taro Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="stylesheet" href="/static/admin.css?v={{ static_version }}">
</head>
<body>
{% block body %}
{% set path = request.url.path %}
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-logo">🔮</span>
      <span><b>Taro Bot</b><small>Админ-панель</small></span>
    </a>
    <nav class="nav">
      {% for href, ico, title in NAV %}
        {% set active = (path == "/") if href == "/" else path.startswith(href) %}
        <a href="{{ href }}" class="{{ 'active' if active }}"><span class="ico">{{ ico }}</span>{{ title }}</a>
      {% endfor %}
    </nav>
    <a class="logout" href="/logout">↩&nbsp; Выйти</a>
  </aside>
  <main class="content"><div class="container">{% block content %}{% endblock %}</div></main>
</div>
{% endblock %}
<script src="/static/admin.js?v={{ static_version }}" defer></script>
</body>
</html>
