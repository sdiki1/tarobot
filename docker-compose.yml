x-app-build: &app-build
  context: .
  args:
    INSTALL_SWISSEPH: ${INSTALL_SWISSEPH:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: *app-build
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: *app-build
    command: python -m scripts.seed
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: *app-build
    restart: unless-stopped
    command: python -m app.bot.main
    env_file: .env
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: *app-build
    restart: unless-stopped
    command: python -m app.worker.main
    env_file: .env
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build: *app-build
    restart: unless-stopped
    command: uvicorn app.admin.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "0.0.0.0:${ADMIN_PANEL_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - admin

volumes:
  pgdata:
